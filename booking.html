<!DOCTYPE html>
<html>
<head>
    <title>Book Vaccination Slot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Vaccination Slot Booking</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="slots.html">Available Slots</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <main>

        <div class="form-container">

            <h2>Book Vaccination Slot</h2>

            <form onsubmit="confirmBooking(event)">

                <label for="name">Full Name</label>
                <input type="text"
                       id="name"
                       placeholder="Enter your full name"
                       required>

                <label for="vaccine">Select Vaccine</label>
                <select id="vaccine" required>
                    <option value="">Select Vaccine</option>
                    <option>COVID-19 Vaccine</option>
                    <option>Influenza Vaccine</option>
                    <option>Hepatitis Vaccine</option>
                </select>

                <label for="center">Vaccination Center</label>
                <select id="center" required>
                    <option value="">Select Center</option>
                    <option>City Vaccination Center</option>
                    <option>Government Health Center</option>
                    <option>Primary Health Center</option>
                </select>

                <label for="date">Vaccination Date</label>
                <input type="date"
                       id="date"
                       required>

                <label for="time">Select Time</label>
                <select id="time" required>
                    <option value="">Select Time</option>
                    <option>10:00 AM - 11:00 AM</option>
                    <option>11:00 AM - 12:00 PM</option>
                    <option>2:00 PM - 3:00 PM</option>
                </select>

                <button type="submit">Confirm Booking</button>

            </form>

            <p id="message"></p>

        </div>

    </main>

    <footer>
        <p>© 2026 Vaccination Slot Booking Platform</p>
    </footer>

    <script>
        function confirmBooking(event) {

            event.preventDefault();

            document.getElementById("message").innerHTML =
                "Vaccination slot booked successfully!";

        }
    </script>

</body>
</html>
